name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: lint, test, and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Provenance (#22) is the Phase 0 data check. Talent coverage (D6)
      # is a later check; add its step here when that CLI exists.
      - name: Provenance
        run: npm run provenance
