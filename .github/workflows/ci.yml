name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: lint, test, and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Provenance (#7, #22) rewrites docs/provenance.md and fails on a
      # missing ref, a bare dash, a placeholder ref, or an unknown source
      # tag. Talent coverage (D6) is a later check; add its step here when
      # that CLI exists.
      - name: Provenance
        run: npm run provenance

      # Fail when that rewrite differs from the committed report (#52).
      - name: Provenance is committed
        run: |
          git diff --exit-code -- docs/provenance.md || {
            echo "::error file=docs/provenance.md::docs/provenance.md is out of date with data/constants.js. Run 'npm run provenance' and commit the result."
            exit 1
          }
